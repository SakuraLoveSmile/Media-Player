name: media_kit_libs_macos_video
description: >-
  Local stand-in for media_kit_libs_macos_video that downloads the "video-full"
  libmpv variant. The official package's default variant ships an FFmpeg without
  the TrueHD/MLP decoder, so TrueHD audio tracks play as silence.
version: 1.1.4
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MediaKitLibsMacosVideoPlugin
