name: watch-image

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable release commit supplied by release validation
        required: true
        type: string
      release_tag:
        required: true
        type: string
      update_latest:
        description: Update latest only when publishing a stable version
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (e.g. v0.4.8-pilot.1794895367)'
        required: true
        type: string
      update_latest:
        description: 'Also update latest (stable versions only; keep off when backfilling old tags)'
        default: false
        type: boolean
  pull_request:
    paths:
      - 'services/watch_together/**'
      - '.github/workflows/watch-image.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'services/watch_together/**'
      - '.github/workflows/watch-image.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate image version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          source = os.environ['SOURCE_REF']
          publish = bool(tag)
          if publish:
              if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?', tag) or len(tag) > 128:
                  raise SystemExit('Expected a Docker-compatible MediaPlayer version tag')
              if source and not re.fullmatch(r'[0-9a-f]{40}', source):
                  raise SystemExit('Reusable release builds require an immutable source SHA')
          elif os.environ['EVENT_NAME'] == 'workflow_dispatch':
              raise SystemExit('Manual publication requires an existing version tag')
          image = 'ghcr.io/' + os.environ['REPOSITORY_OWNER'].lower() + '/media-player-watch-together'
          ref = source or ('refs/tags/' + tag if publish else '')
          stable = bool(re.fullmatch(r'v\d+\.\d+\.\d+', tag)) and os.environ['UPDATE_LATEST'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'image={image}\nref={ref}\npublish={str(publish).lower()}\nstable={str(stable).lower()}\n')
          PY

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve source identity
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke test both architectures
        env:
          EMBY_URL: http://127.0.0.1:18096
          EMBY_SERVER_ID: image-smoke-test
        run: |
          set -euo pipefail
          trap 'docker rm -f watch-image-smoke >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --tag "watch-image-smoke:$arch" services/watch_together
            docker run -d --name watch-image-smoke --platform "linux/$arch" \
              -p 127.0.0.1:18444:18444 -e EMBY_URL -e EMBY_SERVER_ID "watch-image-smoke:$arch"
            healthy=false
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:18444/watch/v1/health > health.json; then
                healthy=true
                break
              fi
              echo "Waiting for $arch health ($attempt/30)"
              sleep 1
            done
            docker logs watch-image-smoke
            test "$healthy" = true
            python3 - <<'PY'
          import json
          assert json.load(open('health.json')) == {'data': {'enabled': True, 'protocol': 1}}
          PY
            docker rm -f watch-image-smoke
          done

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: metadata
        if: steps.version.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}

      - name: Publish multi-platform image
        id: build
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/watch_together
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Keep Docker build records out of the client Release asset download.
          # BuildKit provenance remains attached to the registry manifest.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Record published image
        if: steps.version.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### 一起看服务镜像\n\n%s:%s\n\nDigest: %s\n' "$IMAGE" "$RELEASE_TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
