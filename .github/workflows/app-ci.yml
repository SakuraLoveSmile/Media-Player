name: app-ci

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'macos/**'
      - 'windows/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'android/**'
      - 'macos/**'
      - 'windows/**'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Layer guard
        run: ./tool/check_layering.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      # CocoaPods warns and may misbehave under a non-UTF-8 locale.
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Media\ Player.app media_player-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: media_player-macos.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # dart pub reads a git dependency's pubspec.yaml through `git show` and
      # decodes the output with the Windows ANSI codepage (CP_ACP); feedback_widget's
      # non-ASCII description then fails YAML parsing. Vendor the pinned commit with
      # an ASCII-only pubspec and redirect via pubspec_overrides.yaml — CI-local only;
      # the committed pubspec.yaml/pubspec.lock stay pinned to the Git ref.
      - name: Vendor feedback_widget (Windows pub codepage workaround)
        shell: bash
        run: |
          set -euo pipefail
          git init -q .ci-feedback
          git -C .ci-feedback remote add origin https://github.com/SakuraLoveSmile/Sakura-Feedback.git
          git -C .ci-feedback fetch -q --depth 1 origin 95e4a9c818d4bc248433b5f2b5f0eabb7581298a
          git -C .ci-feedback checkout -q --detach FETCH_HEAD
          tr -d '\200-\377' < .ci-feedback/flutter/feedback/pubspec.yaml > .ci-feedback/flutter/feedback/pubspec.ascii.yaml
          mv .ci-feedback/flutter/feedback/pubspec.ascii.yaml .ci-feedback/flutter/feedback/pubspec.yaml
          printf 'dependency_overrides:\n  feedback_widget:\n    path: .ci-feedback/flutter/feedback\n' > pubspec_overrides.yaml

      - name: Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
