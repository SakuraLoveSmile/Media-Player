name: release

# Tag-driven release pipeline: validate the tag against pubspec.yaml, build the
# three client packages, then create the GitHub Release the in-app updater reads
# (GitHub Releases API, repo SakuraLoveSmile/Media-Player). Asset file names are
# part of the updater contract and must stay exactly:
#   MediaPlayer-android.apk / MediaPlayer-windows-x64.zip / MediaPlayer-macos.zip
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and publish (e.g. v0.1.0). Leave empty to use the dispatched ref name.'
        required: false
        default: ''

# Build jobs only read the repository; the release job lifts this to write access.
permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate tag against pubspec version
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import re
          import sys

          text = open("pubspec.yaml", encoding="utf-8").read()
          match = re.search(r"^version:\s*([^\s#]+)", text, re.MULTILINE)
          if match is None:
              sys.exit("pubspec.yaml has no version field")
          raw = match.group(1).strip().strip("\"'")
          version = raw.split("+", 1)[0]
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              sys.exit("unsupported pubspec version %r (expected X.Y.Z[+build])" % raw)
          print(version)
          PY
          )"
          TAG="$GITHUB_REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag resolved; pass tag_name or dispatch from a tag ref."
            exit 1
          fi
          EXPECTED="v$VERSION"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match pubspec version '$VERSION' (expected '$EXPECTED'); refusing to build a mismatched release."
            exit 1
          fi
          echo "Release tag $TAG matches pubspec version $VERSION."
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Every release must be signed with the same key so a new APK can overlay-
      # install over the version it replaces. android/app/build.gradle.kts selects
      # this fixed `release` signing config whenever android/app/key.properties
      # exists (otherwise it falls back to the debug key for local runs).
      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured. Without the fixed keystore every build gets a fresh debug key and users cannot overlay-install updates."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > android/app/key.properties <<'EOF'
          storeFile=keystore.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --dart-define=FEEDBACK_ENABLED=true --dart-define=FEEDBACK_API_BASE=https://feedback.xn--fhqths51enha.cn --dart-define=FEEDBACK_APP_ID=dev.mediaplayer.media_player

      - name: Stage release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk MediaPlayer-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: MediaPlayer-android.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # dart pub reads a git dependency's pubspec.yaml through `git show` and
      # decodes the output with the Windows ANSI codepage (CP_ACP); feedback_widget's
      # non-ASCII description then fails YAML parsing. Vendor the pinned commit with
      # an ASCII-only pubspec and redirect via pubspec_overrides.yaml — CI-local only;
      # the committed pubspec.yaml/pubspec.lock stay pinned to the Git ref.
      - name: Vendor feedback_widget (Windows pub codepage workaround)
        shell: bash
        run: |
          set -euo pipefail
          git init -q .ci-feedback
          git -C .ci-feedback remote add origin https://github.com/SakuraLoveSmile/Sakura-Feedback.git
          git -C .ci-feedback fetch -q --depth 1 origin 95e4a9c818d4bc248433b5f2b5f0eabb7581298a
          git -C .ci-feedback checkout -q --detach FETCH_HEAD
          tr -d '\200-\377' < .ci-feedback/flutter/feedback/pubspec.yaml > .ci-feedback/flutter/feedback/pubspec.ascii.yaml
          mv .ci-feedback/flutter/feedback/pubspec.ascii.yaml .ci-feedback/flutter/feedback/pubspec.yaml
          printf 'dependency_overrides:\n  feedback_widget:\n    path: .ci-feedback/flutter/feedback\n' > pubspec_overrides.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=FEEDBACK_ENABLED=true --dart-define=FEEDBACK_API_BASE=https://feedback.xn--fhqths51enha.cn --dart-define=FEEDBACK_APP_ID=dev.mediaplayer.media_player

      - name: Package release asset
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MediaPlayer-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: MediaPlayer-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    env:
      # CocoaPods warns and may misbehave under a non-UTF-8 locale.
      LANG: en_US.UTF-8
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_tag }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release --dart-define=FEEDBACK_ENABLED=true --dart-define=FEEDBACK_API_BASE=https://feedback.xn--fhqths51enha.cn --dart-define=FEEDBACK_APP_ID=dev.mediaplayer.media_player

      - name: Package release asset
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Media Player.app" MediaPlayer-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: MediaPlayer-macos.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    # Only this job needs write access: it creates the release the updater reads.
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -l release-assets
          for asset in MediaPlayer-android.apk MediaPlayer-windows-x64.zip MediaPlayer-macos.zip; do
            test -s "release-assets/$asset" || { echo "::error::Missing or empty release asset: $asset"; exit 1; }
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Never overwrite an existing release: the updater must only ever see
          # immutable, complete asset sets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag \
            release-assets/MediaPlayer-android.apk \
            release-assets/MediaPlayer-windows-x64.zip \
            release-assets/MediaPlayer-macos.zip
